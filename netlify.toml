[build]
  functions = "netlify/functions"
  publish = "."

# Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) and writes fresh
# scores/scorers/squad-stats into Netlify Blobs. Well within API-Football's
# 100-requests/day free-tier cap even with several competitions tracked.
[functions."refresh-data"]
  schedule = "0 */6 * * *"
